
name: kvote
on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
jobs:
  poberi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Poberi kvote
        env:
          K: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p data
          curl -sS "https://api.the-odds-api.com/v4/sports/?apiKey=$K" -o /tmp/sports.json
          python3 - <<'EOF'
          import json, os, urllib.request
          k = os.environ["K"]
          sports = json.load(open("/tmp/sports.json"))
          keys = [s["key"] for s in sports if s["key"].startswith("tennis") and s["active"]]
          out = {}
          for key in keys:
              url = (f"https://api.the-odds-api.com/v4/sports/{key}/odds/"
                     f"?apiKey={k}&regions=eu&markets=h2h&oddsFormat=decimal")
              try:
                  out[key] = json.load(urllib.request.urlopen(url, timeout=60))
              except Exception as e:
                  out[key] = {"napaka": str(e)}
          json.dump(out, open("data/kvote.json", "w"), ensure_ascii=False, indent=1)
          print("turnirjev:", len(keys))
          EOF
          date -u +%FT%TZ > data/zajeto.txt
      - name: Shrani
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data
          git commit -m "kvote $(date -u +%F\ %H:%M)" || exit 0
          git push
